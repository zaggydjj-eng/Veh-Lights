name: Build VehicleLights

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get AML headers
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git /tmp/aml
          HDR=$(find /tmp/aml -name amlmod.h | head -n 1)
          test -n "$HDR" || { echo "amlmod.h not found in AML repo"; exit 1; }
          cp -r "$(dirname "$HDR")" jni/mod
          ls jni/mod

      - name: Build with NDK
        run: $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk

      - uses: actions/upload-artifact@v4
        with:
          name: libVehicleLights
          path: libs/armeabi-v7a/libVehicleLights.so
